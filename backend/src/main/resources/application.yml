spring:
  application:
    name: scholaris

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scholaris_db}
    username: ${DB_USERNAME:scholaris}
    password: ${DB_PASSWORD:scholaris}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    query:
      timeout-seconds: 10
      max-rows: 500

logging:
  level:
    org.springframework.security: INFO
